[package]
name = "musicool-app"
version = "2.0.0"
edition = "2021"

description = "MusiCool 桌面应用（Tauri + Rust + Web 前端）"
authors = ["MusiCool"]

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "dialog-open", "dialog-message", "dialog-ask", "dialog-confirm", "shell-open", "dialog", "fs-read-dir", "fs-read-file", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
walkdir = "2"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
lofty = "0.19"
aes = "0.8"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
# 播放：解码（纯 Rust，覆盖库里的 flac/mp3/m4a(aac/alac)/ogg/wav）、输出、重采样
symphonia = { version = "0.5.5", default-features = false, features = ["flac", "mp3", "aac", "alac", "isomp4", "ogg", "vorbis", "wav", "pcm"] }
cpal = "0.18"
rubato = "5"
rtrb = "0.3"

# 开发构建也优化依赖：未优化的解码器 / 重采样器跑不过实时，会欠载卡顿
[profile.dev.package."*"]
opt-level = 3

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]





# Windows：WASAPI 独占模式输出（src/player/output/wasapi_exclusive.rs）。与 cpal 0.18 使用同一版本的 windows crate，不会多编译一份
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
